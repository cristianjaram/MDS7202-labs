services:
  backend:
    build: ./backend
    container_name: sodai-backend
    ports:
      - "8000:8000"
    volumes:
      - ../airflow/models:/app/models:ro
      - ../airflow/data:/app/data:ro
    environment:
      - MODEL_PATH=/app/models/modelo_final.pkl
      - MODEL_INFO_PATH=/app/models/model_info.json
      - DATA_PATH=/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sodai-frontend
    ports:
      - "7860:7860"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
    restart: unless-stopped
